name: Convert MusicXML to ABC

on:
  push:
    paths:
      - 'public/patterns/source-musicxml/*.xml'
      - 'public/patterns/source-musicxml/*.musicxml'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Allow the action to push changes

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better commit messages
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install music21
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Convert MusicXML files to ABC
        run: |
          # Create output directory if it doesn't exist
          mkdir -p public/patterns
          
          # Convert all MusicXML files
          for xmlfile in public/patterns/source-musicxml/*.xml public/patterns/source-musicxml/*.musicxml; do
            if [ -f "$xmlfile" ]; then
              filename=$(basename "$xmlfile")
              name="${filename%.*}"
              echo "Converting $filename to $name.abc"
              python scripts/musicxml_to_abc.py "$xmlfile" "public/patterns/$name.abc"
            fi
          done
      
      - name: Update pattern index
        run: |
          node scripts/update-pattern-index.js
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet public/patterns/*.abc public/patterns/index.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit converted files
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/patterns/*.abc public/patterns/index.json
          git commit -m "Auto-convert MusicXML to ABC and update index [skip ci]"
      
      - name: Push changes
        if: steps.check_changes.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
