<!DOCTYPE html>
<html>
<head>
  <title>ABC Triplet Debug</title>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.0/dist/abcjs-basic-min.js"></script>
</head>
<body>
  <h1>ABC Triplet Debug</h1>
  <button onclick="testParse()">Parse and Log</button>
  <pre id="output" style="font-family: monospace; white-space: pre-wrap;"></pre>
  
  <script>
    function testParse() {
      const abc = `X:1
T:Test
M:4/4
L:1/4
K:C
(3zCC (3CCC | C C C C |`;

      const output = document.getElementById('output');
      output.textContent = 'Parsing...\n\n';
      
      try {
        const parsed = ABCJS.parseOnly(abc);
        
        if (parsed && parsed[0]) {
          const tune = parsed[0];
          
          if (tune.lines) {
            for (const line of tune.lines) {
              if (line.staff && line.staff[0] && line.staff[0].voices) {
                for (const voice of line.staff[0].voices) {
                  voice.forEach((element, i) => {
                    if (element.el_type === 'note') {
                      output.textContent += `\nElement ${i} (${element.rest ? 'REST' : 'NOTE'}):\n`;
                      output.textContent += `  duration: ${element.duration}\n`;
                      
                      // Log ALL properties
                      output.textContent += '  All properties:\n';
                      for (const key in element) {
                        if (element.hasOwnProperty(key)) {
                          const value = element[key];
                          if (typeof value !== 'object' || value === null) {
                            output.textContent += `    ${key}: ${JSON.stringify(value)}\n`;
                          } else {
                            output.textContent += `    ${key}: [object]\n`;
                          }
                        }
                      }
                    }
                  });
                }
              }
            }
          }
        }
        
        console.log('Full parsed object:', parsed);
      } catch (error) {
        output.textContent += '\nError: ' + error.message;
        console.error(error);
      }
    }
  </script>
</body>
</html>
